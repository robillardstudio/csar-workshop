<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>exemple-8</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

<!-- This is the first example where the scene itself changes.
     Everything before this used the same neutral mid-gray so that
     only the labels differed; here the room is part of the
     argument.

     Fog at 0.045 against a cold dark gray: visibility drops to
     roughly 25m, and the recorded walk runs nearly 100m. You
     cannot see what you are walking into, and words arrive out of
     the murk a few at a time. -->
<a-scene fog="type: exponential; color: #3f4048; density: 0.045">

  <!-- dark, cold, and the same color as the fog, so there is no
       horizon line at all — just depth that stops -->
  <a-sky color="#3f4048"></a-sky>

  <!-- the same grid tile as the other examples, redrawn dark so it
       reads as a faint suggestion of ground rather than a surface -->
  <a-plane rotation="-90 0 0" width="2000" height="2000"
           material="shader: flat;
                     src: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMDAnIGhlaWdodD0nMTAwJz4KPHJlY3Qgd2lkdGg9JzEwMCcgaGVpZ2h0PScxMDAnIGZpbGw9JyMzNDM1M2InLz4KPHBhdGggZD0nTTAgMEgxMDBNMCAwVjEwMCcgc3Ryb2tlPScjNDM0NDRjJyBzdHJva2Utd2lkdGg9JzEuNScvPgo8L3N2Zz4K);
                     repeat: 1000 1000"></a-plane>

  <!-- the camera: same rig as exemple-3, at the start of the walk
       facing +z. The route is the real one this time — you are
       retracing the path across the Oval, in bad weather. -->
  <a-entity position="0 1.6 -5" rotation="0 180 0">
    <a-camera look-controls wasd-controls></a-camera>
  </a-entity>

  <!-- every label we generate in script.js gets added inside here -->
  <a-entity id="field"></a-entity>

</a-scene>

<!-- data.csv must sit in this same folder -->
<script src="script.js"></script>

</body>
</html>
