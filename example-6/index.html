<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>exemple-6</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

<!-- Same scene as the earlier examples. Fog at 0.01: the whole
     spiral sits within about 26m of where you start, so it stays
     hazy at the edges without anything vanishing. -->
<a-scene fog="type: exponential; color: #8a8a8a; density: 0.01">

  <!-- uniform mid-gray background, no horizon or heavy contrast -->
  <a-sky color="#8a8a8a"></a-sky>

  <!-- ground: same average gray as the sky, with a light grid tiled
       across it for orientation — the grid image is a 100x100 tile
       with just a top and left edge line, so tiles line up into one
       continuous grid with no doubled or missing lines -->
  <a-plane rotation="-90 0 0" width="2000" height="2000"
           material="shader: flat;
                     src: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMDAnIGhlaWdodD0nMTAwJz4KPHJlY3Qgd2lkdGg9JzEwMCcgaGVpZ2h0PScxMDAnIGZpbGw9JyM3ZDdkN2QnLz4KPHBhdGggZD0nTTAgMEgxMDBNMCAwVjEwMCcgc3Ryb2tlPScjOTk5OTk5JyBzdHJva2Utd2lkdGg9JzEuNScvPgo8L3N2Zz4K);
                     repeat: 1000 1000"></a-plane>

  <!-- the camera: same rig as exemple-3, standing at the bottom of
       the spiral, in the middle of the cylinder.

       fly: true is what makes this example work. The spiral climbs
       to 24m and WASD normally keeps you pinned to the ground; with
       flying on, W moves you along whatever direction you are
       looking, so tilting your head up and holding W lifts you.
       Getting to the last word means learning to steer in three
       dimensions.

       acceleration is lowered from its default 65 to 30, so moving
       is slower and easier to control — the spiral is around 260m
       long and meant to be climbed deliberately, not sprinted.

       The counter is a child of the camera, which means it travels
       with your head: a HUD rather than an object in the world. -->
  <a-entity position="0 1.6 0" rotation="0 180 0">
    <a-camera look-controls wasd-controls="fly: true; acceleration: 30">

      <!-- the crosshair. It shoots an invisible ray straight ahead
           and reports what it hits, which is what turns a word into
           something clickable.
             objects: .word  — only the labels, never the counter
             far: 6          — the ray stops after 6m, so distant
                               words cannot be clicked from here;
                               you have to fly up to them -->
      <a-cursor color="#3a3a3a" fuse="false"
                raycaster="objects: .word; far: 6"></a-cursor>

      <a-text id="hud" value="0 / 0"
              position="0 -0.45 -1" align="center" width="2.5"
              color="#3a3a3a" side="double"></a-text>
    </a-camera>
  </a-entity>

  <!-- every label we generate in script.js gets added inside here -->
  <a-entity id="field"></a-entity>

</a-scene>

<!-- data.csv must sit in this same folder -->
<script src="script.js"></script>

</body>
</html>
